name: Compile OpenTX Firmware
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем более стабильную версию ОС
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: '2.3'

      - name: Install Correct Compiler and Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi maxmod python3-pip
          cmake -B build -DPCB=STM32F4VE -DPCBREV= -DDISABLE_COMPANION=YES -DLCD=ILI9341
          cmake --build build -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentx-stm32f407-firmware
          path: |
            build/*.bin
            build/*.hex
