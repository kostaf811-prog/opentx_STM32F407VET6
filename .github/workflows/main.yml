name: Compile OpenTX Firmware
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: '2.3'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-pillow python3-pip cmake

      - name: Auto-Detect PCB and Build
        run: |
          # 1. Автоматически ищем, какое имя платы прописано в файлах CMakeLists.txt репозитория
          echo "=== Доступные платы в репозитории ==="
          grep -i "set(PCB" radio/src/CMakeLists.txt || grep -i "if (PCB STREQUAL" radio/src/CMakeLists.txt || true
          
          # 2. Определяем имя: если автор использовал стандартную структуру, это будет 'ARM32' с PCBREV='STM32F407'
          # Запускаем конфигурацию с корректными базовыми флагами архитектуры OpenTX
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=radio/src/toolchain-arm-none-eabi.cmake \
            -DPCB=ARM32 \
            -DPCBREV=STM32F407 \
            -DDISABLE_COMPANION=YES \
            -DLCD=ILI9341 \
            -DSERVO_TESTER=NO \
            -DHELI=NO
          
          # 3. Запускаем компиляцию
          cmake --build build -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentx-stm32f407-firmware
          path: |
            build/*.bin
            build/*.hex
