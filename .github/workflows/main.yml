name: Compile OpenTX Firmware
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: '2.3'

      - name: Install Compiler and Build via Make
        run: |
          # 1. Ставим проверенный компилятор напрямую из репозитория системы
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-pillow python3-pip
          
          # 2. Переходим в папку с исходниками радио и запускаем Make в обход CMake
          cd radio/src
          make \
            -j$(nproc) \
            PCB=STM32F4VE \
            PCBREV= \
            DISABLE_COMPANION=YES \
            LCD=ILI9341

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentx-stm32f407-firmware
          path: |
            radio/src/*.bin
            radio/src/*.hex
            *.bin
            *.hex
